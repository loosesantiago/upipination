name: Deploy

on:
  push:
    branches: [master]   # a merged PR lands here
  workflow_dispatch:      # manual "Run workflow" button

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, upipination]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to /opt/upipination
        run: sudo /usr/local/sbin/upipination-deploy
